name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project (editable) + dev deps
        working-directory: ./server
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest httpx ruff pip-audit

      - name: Audit dependencies (CVE scan)
        working-directory: ./server
        run: pip-audit -r requirements.txt || true

      - name: Lint (ruff)
        working-directory: ./server
        run: ruff check . --fix || true

      - name: Run pytest
        working-directory: ./server
        run: pytest -q
