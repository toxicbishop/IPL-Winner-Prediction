[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipl-winner-prediction"
version = "0.1.0"
description = "IPL 2026 winner prediction ensemble with FastAPI dashboard backend."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "joblib>=1.3.0",
    "shap>=0.44.0",
    "optuna>=4.0.0",
    "fastapi>=0.136.0",
    "uvicorn>=0.29.0",
    "tqdm>=4.67.0",
    "pydantic>=2.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["config", "main", "server"]

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*", "notebooks*", "dashboard*", "data*", "outputs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long (formatter handles)
    "E402",  # module-level imports not at top (legacy files)
]
