[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipl-winner-prediction"
version = "0.1.0"
description = "IPL 2026 winner prediction ensemble with FastAPI dashboard backend."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "scikit-learn==1.5.1",
    "xgboost==2.1.1",
    "lightgbm==4.6.0",
    "matplotlib==3.9.2",
    "seaborn==0.13.2",
    "joblib==1.4.2",
    "shap==0.46.0",
    "optuna==4.0.0",
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "tqdm==4.66.5",
    "pydantic==2.9.2",
    "pyarrow==23.0.1",
    "psycopg2-binary==2.9.9",
    "mlflow~=3.15.0",
    "python-dotenv==1.2.2",
    "slowapi==0.1.9",
    "sqlalchemy==2.0.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["config", "main", "server"]

[tool.setuptools.packages.find]
include = ["src*"]
exclude = ["tests*", "notebooks*", "dashboard*", "data*", "outputs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # line too long (formatter handles)
    "E402",  # module-level imports not at top (legacy files)
]
